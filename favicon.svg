<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="10" fill="#1f1c17"/>
  <rect x="2" y="2" width="60" height="60" rx="8" fill="none" stroke="#d4a64a" stroke-width="1.5"/>

  <!-- Mammoth head, front-facing, like the logo -->

  <!-- Head dome with fur sides -->
  <path d="M32 10
           C 20 10, 13 18, 13 28
           C 13 34, 15 39, 18 43
           L 20 50
           L 24 48
           L 27 52
           L 32 50
           L 37 52
           L 40 48
           L 44 50
           L 46 43
           C 49 39, 51 34, 51 28
           C 51 18, 44 10, 32 10 Z"
        fill="#d4a64a"/>

  <!-- Fur tuft on top -->
  <path d="M28 11 L30 7 L32 11 L34 7 L36 11 Z" fill="#b8531f"/>

  <!-- Ears -->
  <path d="M14 26 C 10 26, 8 30, 10 34 C 12 36, 15 35, 16 32 Z" fill="#b8531f"/>
  <path d="M50 26 C 54 26, 56 30, 54 34 C 52 36, 49 35, 48 32 Z" fill="#b8531f"/>

  <!-- Brow shadow -->
  <path d="M20 24 C 25 22, 39 22, 44 24 L 44 28 C 39 26, 25 26, 20 28 Z" fill="#8a6a2a" opacity="0.7"/>

  <!-- Eyes -->
  <circle cx="25" cy="29" r="2" fill="#1f1c17"/>
  <circle cx="39" cy="29" r="2" fill="#1f1c17"/>
  <circle cx="25.7" cy="28.3" r="0.6" fill="#efe6cf"/>
  <circle cx="39.7" cy="28.3" r="0.6" fill="#efe6cf"/>

  <!-- Trunk curling down between tusks -->
  <path d="M29 36
           C 28 42, 28 48, 30 53
           C 31 55, 33 55, 34 53
           C 36 48, 36 42, 35 36 Z"
        fill="#b07a2a"/>
  <!-- Trunk wrinkle lines -->
  <path d="M29 40 H35 M28.8 44 H35.2 M29 48 H35" stroke="#7a5418" stroke-width="0.6" fill="none"/>

  <!-- Tusks: curving outward and forward -->
  <g fill="#efe6cf" stroke="#1f1c17" stroke-width="0.8" stroke-linejoin="round">
    <path d="M24 38
             C 20 42, 17 48, 18 55
             C 19 57, 22 56, 22 54
             C 22 49, 24 44, 27 41 Z"/>
    <path d="M40 38
             C 44 42, 47 48, 46 55
             C 45 57, 42 56, 42 54
             C 42 49, 40 44, 37 41 Z"/>
  </g>
</svg>
